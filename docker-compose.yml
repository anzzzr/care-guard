# `docker compose up --build` runs Postgres (with pgvector) and the API on http://localhost:8000.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careguard}
      POSTGRES_DB: ${POSTGRES_DB:-careguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careguard} -d ${POSTGRES_DB:-careguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # GEMINI_API_KEY, GEMINI_MODEL, ADMIN_API_KEY, MIN_SCORE come from .env if it exists.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-careguard}:${POSTGRES_PASSWORD:-careguard}@db:5432/${POSTGRES_DB:-careguard}
    ports:
      - "8000:8000"

volumes:
  pgdata:
