# M0: database only. The app service is added in M6 together with the Dockerfile.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careguard}
      POSTGRES_DB: ${POSTGRES_DB:-careguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careguard} -d ${POSTGRES_DB:-careguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
