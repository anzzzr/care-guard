# 30 evaluation scenarios for CareGuard.
#
# Fields:
#   id, category, member_api_key, question   - required
#   must_refuse: true/false                   - response.refused must equal this (if given)
#   must_call_tool: <tool name>               - that tool must appear in tools_used
#   must_cite_file: <file>                    - a citation from this file whose quote really
#                                               appears in that file on disk
#   must_create_ticket: true                  - response.ticket_id must be set
#   answer_must_contain: [...]                - each item must appear in the answer; an item that
#                                               is itself a list passes if any one option appears
#   answer_must_not_contain: [...]            - none may appear in the answer
#   needs_real_llm: <why>                     - skipped in --fake mode: passing depends on the
#                                               LLM's judgement, which the rule-based fake lacks
# Text checks ignore case and commas, so "₹1,92,000" and "₹192,000" both match "192000".
#
# Members: m001 Basic (34 yrs, CLM-1001..1003), m002 Basic (62 yrs), m005 Plus, m006 Plus
# (owns CLM-1017..1020), m008 / m009 Senior.

# ---------- Coverage / policy questions (10): answer with a valid citation ----------
- id: C01
  category: coverage
  member_api_key: demo-key-m001
  question: Is cataract surgery covered under my plan? Is there a waiting period?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_basic.md
  answer_must_contain: [["2 years", "two years"]]

- id: C02
  category: coverage
  member_api_key: demo-key-m001
  question: What is the room rent limit on my policy?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_basic.md
  answer_must_contain: ["3,000"]

- id: C03
  category: coverage
  member_api_key: demo-key-m005
  question: Is there a room rent limit on my plan?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_plus.md
  answer_must_contain: [["no room rent limit", "no limit", "no cap", "not limited", "any room"]]
  answer_must_not_contain: ["3,000"]

- id: C04
  category: coverage
  member_api_key: demo-key-m002
  question: I am 62. Do I have to pay a co-payment?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_basic.md
  answer_must_contain: ["20%"]

- id: C05
  category: coverage
  member_api_key: demo-key-m008
  question: What is the co-payment on my plan?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_senior.md
  answer_must_contain: ["30%"]

- id: C06
  category: coverage
  member_api_key: demo-key-m005
  question: Is maternity covered, and how much is paid for a caesarean delivery?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_plus.md
  answer_must_contain: ["75,000"]

- id: C07
  category: coverage
  member_api_key: demo-key-m001
  question: Is maternity covered under my plan?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_basic.md
  answer_must_contain: [["not covered", "not included", "excluded", "does not cover"]]

- id: C08
  category: coverage
  member_api_key: demo-key-m009
  question: How long is the waiting period for pre-existing diseases?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_senior.md
  answer_must_contain: [["1 year", "one year"]]

- id: C09
  category: coverage
  member_api_key: demo-key-m006
  question: Which hospital in Mumbai offers cashless treatment?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: sahay_plus.md
  answer_must_contain: ["Harbourview"]

- id: C10
  category: coverage
  member_api_key: demo-key-m008
  question: What documents do I need to send for a reimbursement claim?
  must_refuse: false
  must_call_tool: search_policy
  must_cite_file: claims_process.md
  answer_must_contain: ["discharge summary"]

# ---------- Claim questions (8): right tool, right numbers ----------
- id: K01
  category: claim
  member_api_key: demo-key-m001
  question: Why was my claim CLM-1003 partly rejected?
  must_refuse: false
  must_call_tool: get_claim
  answer_must_contain: ["room rent"]

- id: K02
  category: claim
  member_api_key: demo-key-m001
  question: What is the status of claim CLM-1002?
  must_refuse: false
  must_call_tool: get_claim
  answer_must_contain: ["rejected"]

- id: K03
  category: claim
  member_api_key: demo-key-m002
  question: How much was approved for my knee replacement claim?
  must_refuse: false
  must_call_tool: get_my_claims
  answer_must_contain: ["192000"]

- id: K04
  category: claim
  member_api_key: demo-key-m006
  question: List all my claims.
  must_refuse: false
  must_call_tool: get_my_claims
