[project]
name = "careguard"
version = "0.1.0"
description = "Health insurance claims & benefits copilot for the fictional insurer Sahay Health"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=3.6.1",
    "httpx2>=2.16",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.4",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # required by FastAPI's TestClient
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Gemini API (run with -m live)"]

# On Linux (Docker, CI) use the CPU-only PyTorch build: the default one pulls multi-GB
# CUDA libraries we never use. macOS wheels from PyPI are already CPU/MPS only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
